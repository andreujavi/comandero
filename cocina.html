<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroPos - Panel de Cocina</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            background-color: #ffc107; /* Pendiente */
            font-weight: bold;
        }
        .estado-conexion {
            text-align: right;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👨‍🍳 Comandas en Tiempo Real (Cocina)</h1>
        <div id="estado-conexion" class="estado-conexion">Conectando con el servidor...</div>
          <button id="btn-probar-envio">Enviar Comanda</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mesa</th>
                    <th>Detalles del Pedido</th>
                    <th>Estado</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody id="tabla-pedidos">
                <tr>
                    <td colspan="5" style="text-align: center;">Cargando pedidos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // URL del servidor backend de Node.js en el PC
        // - Si abres esto en el propio PC: 'http://localhost:3000/api/pedidos'
        // - Si lo abres desde la tablet u otro dispositivo: 'http://IP_DE_TU_PC:3000/api/pedidos'
        const URL_SERVIDOR = 'https://comandero-6yq6.onrender.com';
        const configuracionICE = {
        iceServers: [
        // 1. Servidores STUN públicos y gratuitos (Google y Cloudflare)
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },

        // 2. Servidores TURN (Respaldo obligatorio para redes 4G/5G o routers bloqueados)
        // Sustituye estos datos por los de tu proveedor TURN (ej. Metered.ca)
        const iceConfiguration = {
      iceServers: [
          {
              urls: 'turn:free.expressturn.com:3478',
              username: '000000002102154901',
              credential: 'zTwHEShFvegqotlDMnVBLEt7pTo='
          }
      ]
  }

  const peerConnection = new RTCPeerConnection(iceConfiguration);
  function parseNumero(valor, fallback = 0) {
    if (typeof valor === 'number') return Number.isFinite(valor) ? valor : fallback;
    const normalizado = String(valor ?? '').trim().replace(',', '.');
    const num = Number(normalizado);
    return Number.isFinite(num) ? num : fallback;
  }

  function recolectarYValidarComanda() {
    const mesaInput = document.getElementById('mesa');
    const mesa = (mesaInput?.value || '').trim();

    if (!mesa) {
      return { ok: false, error: 'Falta indicar la mesa o barra.' };
    }

    const filas = [...document.querySelectorAll('#items-container .item-row')];
    const items = filas
      .map((row, idx) => {
        const nombre = (row.querySelector('.item-nombre')?.value || '').trim();
        const cantidadRaw = row.querySelector('.item-cantidad')?.value;
        const precioRaw = row.querySelector('.item-precio')?.value;

        const cantidad = Math.max(1, Math.round(parseNumero(cantidadRaw, 1)));
        const precio = Math.max(0, parseNumero(precioRaw, 0));

        return { fila: idx + 1, nombre, cantidad, precio };
      })
      .filter((item) => item.nombre.length > 0);

    if (items.length === 0) {
      return { ok: false, error: 'Añade al menos un producto con nombre antes de enviar.' };
    }

    const itemInvalido = items.find((it) => Number.isNaN(it.cantidad) || Number.isNaN(it.precio));
    if (itemInvalido) {
      return {
        ok: false,
        error: `Revisa cantidad o precio en la línea ${itemInvalido.fila} ("${itemInvalido.nombre}").`,
      };
    }

    const payloadItems = items.map(({ nombre, cantidad, precio }) => ({
      nombre,
      cantidad,
      precio,
    }));

    const total = Number(
      payloadItems.reduce((acc, it) => acc + it.cantidad * it.precio, 0).toFixed(2)
    );

    return {
      ok: true,
      payload: {
        mesa,
        items: payloadItems,
        total,
        estado: 'pendiente',
      },
    };
  }

  async function enviarComanda(e) {
    e.preventDefault();
    const mensajeEl = document.getElementById('mensaje-form');
    const btnSubmit = e.currentTarget.querySelector('button[type="submit"]');

    const validacion = recolectarYValidarComanda();
    if (!validacion.ok) {
      if (mensajeEl) mensajeEl.textContent = `Validación: ${validacion.error}`;
      console.warn('[GastroPOS] Validación fallida:', validacion.error);
      return;
    }

    const url = '/api/pedidos';
    const payload = validacion.payload;

    if (btnSubmit) btnSubmit.disabled = true;
    if (mensajeEl) mensajeEl.textContent = 'Enviando comanda...';

    console.group('[GastroPOS] POST /api/pedidos');
    console.log('URL:', url);
    console.log('Payload:', payload);

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const textoRespuesta = await res.text();
      let data = null;
      try {
        data = textoRespuesta ? JSON.parse(textoRespuesta) : null;
      } catch {
        data = null;
      }

      console.log('Status HTTP:', res.status, res.statusText);
      console.log('Respuesta cruda:', textoRespuesta);
      console.groupEnd();

      if (!res.ok || !data?.ok) {
        const detalleServidor =
          data?.error || data?.message || textoRespuesta || `Error HTTP ${res.status}`;
        throw new Error(`[HTTP ${res.status}] ${detalleServidor}`);
      }

      if (mensajeEl) {
        mensajeEl.textContent = `Comanda #${data.pedido?.id ?? ''} guardada (${payload.mesa}).`;
      }
      cargarPedidos();
    } catch (err) {
      console.error('[GastroPOS] Error al enviar comanda:', err);
      console.groupEnd?.();
      if (mensajeEl) {
        mensajeEl.textContent = `Error al enviar comanda: ${err.message}`;
      }
    } finally {
      if (btnSubmit) btnSubmit.disabled = false;
    }

    </script>

</body>
</html>
