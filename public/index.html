<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroPOS - Cristal Líquido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fondo animado -->
    <div class="bg-animado"></div>

    <div class="app-container">
        <header class="glass-header">
            <h1>🍹 GastroPOS <span id="estado-conexion" class="badge">Conectando...</span></h1>
        </header>

        <main class="grid-principal">
            <!-- COLUMNA 1: ZONAS Y MESAS -->
            <section class="glass-panel">
                <h2>📍 Zonas</h2>
                
                <div class="zona">
                    <h3>Barra</h3>
                    <div class="mesas-grid" id="barra">
                        <button class="glass-btn mesa-btn">B1</button>
                        <button class="glass-btn mesa-btn">B2</button>
                        <button class="glass-btn mesa-btn">B3</button>
                        <button class="glass-btn mesa-btn">B4</button>
                        <button class="glass-btn mesa-btn">B5</button>
                    </div>
                </div>

                <div class="zona">
                    <h3>Interior</h3>
                    <div class="mesas-grid" id="interior">
                        <button class="glass-btn mesa-btn">M1</button>
                        <button class="glass-btn mesa-btn">M2</button>
                        <button class="glass-btn mesa-btn">M3</button>
                        <button class="glass-btn mesa-btn">M4</button>
                        <button class="glass-btn mesa-btn">M5</button>
                    </div>
                </div>

                <div class="zona">
                    <h3>Terraza</h3>
                    <div class="mesas-grid" id="terraza">
                        <button class="glass-btn mesa-btn">T1</button>
                        <button class="glass-btn mesa-btn">T2</button>
                        <button class="glass-btn mesa-btn">T3</button>
                        <button class="glass-btn mesa-btn">T4</button>
                        <button class="glass-btn mesa-btn">T5</button>
                    </div>
                </div>
            </section>

            <!-- COLUMNA 2: TOMAR COMANDA -->
            <section class="glass-panel pedido-panel">
                <h2>📝 Tomar Pedido</h2>
                <div class="mesa-seleccionada">Mesa actual: <span id="mesa-actual">Ninguna</span></div>
                
                <div class="productos-grid">
                    <button class="glass-btn prod-btn">☕ Café</button>
                    <button class="glass-btn prod-btn">🍺 Caña</button>
                    <button class="glass-btn prod-btn">🍷 Vino</button>
                    <button class="glass-btn prod-btn">🍟 Bravas</button>
                    <button class="glass-btn prod-btn">🦑 Calamares</button>
                    <button class="glass-btn prod-btn">🍔 Burger</button>
                </div>

                <textarea id="nota-pedido" class="glass-input" placeholder="Notas adicionales (ej. sin cebolla)"></textarea>
                
                <button id="btn-enviar" class="glass-btn enviar-btn">🚀 ENVIAR A COCINA</button>
            </section>

            <!-- COLUMNA 3: COCINA / HISTORIAL -->
            <section class="glass-panel">
                <h2>🔥 Comandas Activas</h2>
                <ul id="lista-comandas" class="comandas-lista">
                    <!-- Las comandas aparecerán aquí -->
                </ul>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
