[package]
name = "gastropos"
version = "1.0.0"
description = "GastroPOS Desktop Application"
authors = ["GastroPOS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-fs = "2"

[lib]
name = "gastropos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
